spring.application.name=product-service
server.port=8082

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Database connection
spring.datasource.url=jdbc:mysql://localhost:3307/product_db
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true



# Local AWS S3 configuration for Floci
aws.s3.endpoint=http://localhost:4566
aws.s3.region=ap-south-1
aws.s3.access-key=test
aws.s3.secret-key=test
aws.s3.bucket=spring-microservices-lab
management.endpoints.web.exposure.include=health,mappings